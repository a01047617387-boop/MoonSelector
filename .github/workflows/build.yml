name: Build MoonSelector

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Maven 빌드
        run: mvn clean package -B

      - name: .jar 파일 업로드 (다운로드 가능하게)
        uses: actions/upload-artifact@v4
        with:
          name: MoonSelector
          path: target/MoonSelector-*.jar
          retention-days: 30